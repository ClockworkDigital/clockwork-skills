<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code Factory</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#19202b;--line:#303b4b;--muted:#9aaac0;--text:#e9edf4;--blue:#89cfff;--green:#82e2ba;--pink:#ff9ec6;--amber:#ffd08a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}header{padding:30px 32px 20px;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:25px;letter-spacing:-1px}header p{margin:4px 0;color:var(--muted)}select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#connection{color:var(--muted);font-size:12px}.summary{margin:0 32px 24px;display:flex;gap:12px;flex-wrap:wrap}.metric{padding:12px 18px;background:var(--panel);border-radius:10px;min-width:130px}.metric strong{display:block;font-size:24px}.metric span{color:var(--muted);font-size:12px}.board{padding:0 32px 32px;display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:16px;overflow:auto;min-height:55vh}.column h2{font-size:13px;font-weight:600;margin:0 0 15px;border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;justify-content:space-between}.column h2 span{color:var(--muted)}.card{display:block;text-align:left;width:100%;margin:0 0 12px;padding:15px;background:var(--panel);border-radius:12px}.card strong{display:block;font-size:14px;margin:8px 0}.meta,.branch{font:11px/1.6 ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.stage{color:var(--blue)}.attention{border-color:var(--pink)}.ready{border-color:var(--green)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.chip{font:10px ui-monospace,monospace;border:1px solid var(--line);padding:4px 6px;border-radius:5px}.pass{color:var(--green)}.fail{color:var(--amber)}.reason{font-size:12px;color:var(--muted);margin-top:10px}.empty{color:var(--muted);font-size:12px;padding:8px 0}#warnings{margin:0 32px;color:var(--amber);white-space:pre-wrap}footer{padding:0 32px 30px;color:var(--muted);font-size:12px}dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(950px,100vw);height:100dvh;max-height:100dvh;max-width:100vw;border:0;border-left:1px solid var(--line);padding:0;background:var(--bg);color:var(--text)}dialog::backdrop{background:#0009}.drawer-head{padding:24px;border-bottom:1px solid var(--line)}.drawer-head h2{font-size:20px;margin:8px 45px 10px 0}.close{float:right}.detail{display:grid;grid-template-columns:220px 1fr;height:calc(100% - 180px)}nav{padding:16px;overflow:auto;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;font:11px ui-monospace,monospace;margin-bottom:6px;overflow-wrap:anywhere}.selected{border-color:var(--blue)}pre{margin:0;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;font:12px/1.65 ui-monospace,monospace}a{color:var(--blue)}@media(max-width:700px){header{padding:20px}.summary{margin:0 20px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.metric{min-width:0;padding:12px}.board{padding:0 20px 20px;grid-template-columns:1fr;min-height:0}.detail{grid-template-columns:1fr;grid-template-rows:120px 1fr}nav{display:flex;gap:6px;overflow:auto}nav button{min-width:160px}}
</style></head><body>
<header><div><h1>Claude Code Factory</h1><p>From issue to reviewed change. You make the merge.</p></div><div class="tools"><label for="project">Repository</label><select id="project"><option value="">All repositories</option></select><button id="refresh">Refresh</button><span id="connection" role="status">Connecting…</span></div></header>
<div id="warnings" role="alert"></div><section class="summary" id="summary" aria-label="Job totals"></section><main class="board" id="board"></main>
<footer>Saved state · refreshes every 2 seconds · no merge actions · process liveness and GitHub merge status are not inferred</footer>
<dialog id="drawer" aria-labelledby="title"><div class="drawer-head"><button class="close" id="close" aria-label="Close job details">✕</button><div class="meta" id="identity"></div><h2 id="title"></h2><div id="jobmeta" class="meta"></div><a id="pr" target="_blank" rel="noopener noreferrer" hidden>Open pull request ↗</a></div><div class="detail"><nav id="files" aria-label="Job artifacts"></nav><pre id="document" tabindex="0"></pre></div></dialog>
<script>
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');
const columns=[['Plan',['prepare','intake','spec']],['Build',['build']],['Verify',['gate','review']],['Ready / PR',['ready','published']],['Needs attention',['needs-info','needs-human']],['Finished',['merged','rejected']]];
let data={projects:[],jobs:[],warnings:[]},selected=null,file=null,loading=false,boardKey='',requestVersion=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function get(path){const r=await fetch(path,{headers:{'X-Factory-Token':token},cache:'no-store'});if(!r.ok)throw Error(await r.text());return r}
function repoName(id){return data.projects.find(p=>p.id===id)?.name||id}
function key(j){return j.repo+'/'+j.id}
function card(j){const c=el('button',undefined,'card '+(j.stage.startsWith('needs-')?'attention':['ready','published'].includes(j.stage)?'ready':''));c.append(el('div',repoName(j.repo)+(j.issue?' · #'+j.issue:''),'meta'),el('strong',j.title||j.id),el('div',j.stage+' · round '+(j.round||0)+(j.intake?.risk?' · '+j.intake.risk+' risk':''),'meta stage'),el('div',j.branch||'','branch'));
const last=(j.attempts||[]).at(-1);if(last)c.append(el('div',last.role+' · '+last.model+' · '+last.status,'meta'));
const chips=el('div',undefined,'chips');if(j.gate?.passed!=null)chips.append(el('span','gate '+(j.gate.passed?'PASS':'FAIL'),'chip '+(j.gate.passed?'pass':'fail')));for(const [role,r]of Object.entries(j.reviews||{})){const v=r.result?.verdict||'pending';chips.append(el('span',role+' '+v,'chip '+(v==='pass'?'pass':'fail')))}c.append(chips);if(j.error)c.append(el('div',j.error.slice(0,160),'reason'));c.onclick=()=>open(j);return c}
function render(){const project=$('project').value;const old=project;const options=JSON.stringify(data.projects);if($('project').dataset.options!==options){$('project').replaceChildren(el('option','All repositories'));$('project').firstChild.value='';for(const p of data.projects){const o=el('option',p.name);o.value=p.id;$('project').append(o)}$('project').value=old;$('project').dataset.options=options}
const jobs=data.jobs.filter(j=>!project||j.repo===project);const signature=JSON.stringify([project,jobs]);if(signature===boardKey)return;boardKey=signature;
$('summary').replaceChildren();for(const [label,num]of [['Jobs',jobs.length],['Needs attention',jobs.filter(j=>j.stage.startsWith('needs-')).length],['Ready / PR',jobs.filter(j=>['ready','published'].includes(j.stage)).length]]){const n=el('div',undefined,'metric');n.append(el('strong',String(num)),el('span',label));$('summary').append(n)}
$('board').replaceChildren();for(const [name,stages]of columns){const section=el('section',undefined,'column'),list=jobs.filter(j=>stages.includes(j.stage)).sort((a,b)=>(b.updated_at||0)-(a.updated_at||0));const h=el('h2',name);h.append(el('span',String(list.length)));section.append(h);for(const j of list)section.append(card(j));if(!list.length)section.append(el('div','No jobs','empty'));$('board').append(section)}
const unknown=jobs.filter(j=>!columns.some(([,s])=>s.includes(j.stage)));if(unknown.length){const section=el('section',undefined,'column');section.append(el('h2','Unknown stage'));unknown.forEach(j=>section.append(card(j)));$('board').append(section)}}
async function open(j){selected=key(j);file=null;if(!$('drawer').open)$('drawer').showModal();await details()}
async function details(){const j=data.jobs.find(j=>key(j)===selected);if(!j)return;const myJob=selected;const version=++requestVersion;
$('identity').textContent=repoName(j.repo)+' · '+j.id;$('title').textContent=j.title||j.id;$('jobmeta').textContent=j.stage+' · round '+j.round+' · '+(j.intake?.risk||'risk pending')+' · '+j.branch;
$('pr').hidden=true;try{const u=new URL(j.pr);if(u.protocol==='https:'){$('pr').href=u.href;$('pr').hidden=false}}catch{}
if(!j.files.includes(file))file=j.files.includes('job.json')?'job.json':j.files[0];const myFile=file;
const navKey=JSON.stringify([selected,file,j.files]);if($('files').dataset.key!==navKey){$('files').dataset.key=navKey;$('files').replaceChildren();for(const f of j.files){const b=el('button',f,f===file?'selected':'');b.onclick=()=>{file=f;details()};$('files').append(b)}}
if(!file){$('document').textContent='No artifacts yet.';return}
try{const r=await get('/api/artifact?'+new URLSearchParams({repo:j.repo,job:j.id,name:file}));let text=await r.text();if(file.endsWith('.json')){try{text=JSON.stringify(JSON.parse(text),null,2)}catch{}}
if(version===requestVersion&&selected===myJob&&file===myFile&&$('document').textContent!==text)$('document').textContent=text;
}catch(e){if(version===requestVersion)$('document').textContent=e.message}}
async function poll(){if(loading)return;loading=true;try{data=await(await get('/api/jobs')).json();$('warnings').textContent=data.warnings.join('\n');render();if($('drawer').open)await details();$('connection').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){$('connection').textContent='Disconnected: '+e.message}finally{loading=false}}
$('project').onchange=render;$('refresh').onclick=poll;$('close').onclick=()=>$('drawer').close();$('drawer').addEventListener('close',()=>{selected=null;requestVersion++});poll();setInterval(poll,2000);
</script></body></html>
